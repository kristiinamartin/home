# WORK EXPERIENCE: one entry per position, newest first.
# The career timeline (About and Experience pages) and the Experience page are built from this file.
#
# To add a role, copy a whole block (from "- id:" down to the last bullet) and edit it.
#   id        short unique name with no spaces; used in links, e.g. "eitrm"
#   row       employer name shown on the left of the timeline (same text = same row)
#   bar       short label inside the timeline bar
#   kind      current | consulting | research | venture | industry (sets the bar colour)
#   periods   start and end as "YYYY-MM". Leave out "end" for a current role.
#             A role with two spells (like a return to a company) lists two periods.
#   themes    topics for the filter chips; ids are in themes.yml
# Put any text containing a colon inside double quotes.

- id: eitrm
  row: EIT RawMaterials
  bar: Project Officer
  kind: current
  org: EIT RawMaterials
  title: Project Officer, Innovation Team
  location: Berlin
  periods:
    - start: 2026-06
  themes:
    - innovation
    - crm
    - circular
  summary: Evaluates the innovation and business potential of consortium projects in innovation calls, manages EIT RawMaterials' contribution to two Horizon Europe projects, and leads working groups with industry in the Green and Circular Metals network.
  bullets:
    - Lead technical evaluation of innovation funding applications of up to €2.5M, scoring the innovativeness and business potential of consortium projects. 18 projects evaluated across the last two call cut-offs.
    - Manage EIT RawMaterials' contribution to two Horizon Europe projects, RISERS and the CCRI Community of Practice for Critical Raw Materials, including direct management of the subcontractors who deliver project work.
    - Lead the working groups on greenhouse gas assessments and on CO2 costs and savings for the Green and Circular Metal Strategic Impact Group Network (SIGN), with around 20 industry members and web meetings every five weeks.
    - Establishing and leading a further SIGN working group on e-waste recycling.
    - Co-organise the SIGN Expert Forum and work with the communications team on conference messaging and delivery.
- id: adelphi-mgr
  row: adelphi
  bar: Manager
  kind: consulting
  org: adelphi
  title: Manager, Climate Policy
  location: Berlin
  periods:
    - start: 2025-04
      end: 2026-01
  themes:
    - policy
    - ghg
    - finance
  summary: Technical and strategic work on climate policy, GHG accounting, MRV and climate finance for governments and international organisations, with a focus on industrial decarbonisation and carbon management. Clients included UBA, GIZ, PwC and the Global Center on Adaptation.
  bullets:
    - Provided strategic consulting on climate and energy transition policy, with a focus on industrial decarbonisation and carbon management.
