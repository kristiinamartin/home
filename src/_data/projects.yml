  client: Elron, Estonia's government-owned passenger train operator
  themes:
    - ghg
  text: Contributed to a GHG calculation tool for a simplified comparative life cycle assessment. Led the calculation of emission factors for diesel and electric trains in the Estonian context, including the CO2 emission factor of the Estonian electricity mix, for comparison with diesel buses.
- id: green-bond-framework-second-opinion
