- id: towards-a-nordic-baltic-circular-textile
  role: sei
  title: Towards a Nordic-Baltic circular textile system
  client: Nordic Council of Ministers
  themes:
    - textiles
    - circular
  text: Led the project on textile circularity in the Baltic countries, managing budget, fundraising and reporting. Oversaw an 8-member distributed team across Estonia, Latvia, Lithuania and Denmark, organised three local dialogue events, and supported conferences in Latvia and Lithuania. Researched textile flows in Estonia and co-authored two reports.
- id: ghg-calculation-tool-for-businesses
  role: sei
  title: GHG Calculation Tool for Businesses
  client: Estonian Ministry of Environment
  themes:
    - ghg
    - finance
  text: An Excel-based tool built on the GHG Protocol that lets Estonian businesses calculate their emissions and show how much CO2 the climate initiatives they finance will save. One of the main contributors within the consortium. Led the collection and calculation of emission factors for Estonian district heating systems and consumption-based electricity, and engaged stakeholders across several industries to support adoption.
- id: environmental-impact-assessment-of-the-estonian
  role: sei
  title: Environmental impact assessment of the Estonian defence sector
  client: National Defence Investment Centre
  themes:
    - ghg
    - policy
  text: 'Leading analyst. Collected and analysed data and calculated the environmental footprint: GHG emissions from energy use, waste and water consumption. Translated climate, energy and waste policies into a format organisation representatives could use, developed Scope 1 and 2 reduction measures with cost analysis in an Excel tool with localised emission factors, and facilitated stakeholder interviews.'
- id: comparative-lca-tool-for-ghg-emissions
