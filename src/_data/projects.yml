# PROJECTS: one entry per project. Each project belongs to a role through "role",
# which must match an "id" in roles.yml. Projects appear under their role on the
# Experience page.
#
# To add a project, copy a block and edit it.
#   id        short unique name, no spaces (used in links)
#   role      id of the role it belongs to
#   themes    topics for the filter chips (ids are in themes.yml)
#   points    optional bullet list shown under the text
# Put any text containing a colon inside double quotes.

- id: innovation-call-evaluations
  role: eitrm
  title: Innovation call evaluations
  client: EIT RawMaterials innovation calls, funding up to €2.5M per project
  themes:
    - innovation
    - crm
    - circular
  text: Applicants are consortia of startups, SMEs, large industry and research organisations, and each must represent the knowledge triangle of higher education, research and industry. I score the innovativeness and business potential of each application. My score is combined with the business development team's score, who examine the business case and financial mechanisms, and with the consensus score of external evaluators. Management and the access to finance team review the top-ranked projects and decide who is funded. In return EIT RawMaterials receives revenue sharing or an equity stake. Critical raw materials innovation and circular economy projects are routed to me.
- id: risers
  role: eitrm
  title: RISERS
  client: Horizon Europe, regulatory and standards barriers to industrial symbiosis
  themes:
    - circular
    - policy
  text: EIT RawMaterials is a contributing partner to several work streams, with a budget of around €200,000. I took part in a webinar and the technical committee, revised the roadmap, and supported the final conference and final partner meeting. I wrote an article on regulatory barriers to industrial symbiosis in the steel and cement sectors, reviewed by an external expert, and prepared the Steel chapter presentation for the WP7 Technical Committee.
- id: ccri
  role: eitrm
  title: Circular Cities and Regions Initiative (CCRI), Community of Practice for Critical Raw Materials
  client: Horizon Europe coordination and support action, runs to March 2027
  themes:
    - crm
    - circular
    - policy
  text: EIT RawMaterials leads the community of practice (budget around €200K), which engaged 15 cities from across Europe. I supported two meetings and webinars, with a capacity-building meeting planned for 2027, contributed to a case study, a policy brief and a white paper, and directly manage the subcontractors working for EIT RawMaterials in the project.
- id: sign
  role: eitrm
  title: Green and Circular Metal Strategic Impact Group Network (SIGN)
  client: Industry working groups and Expert Forum
  themes:
    - ghg
    - circular
    - crm
  text: I lead the working groups on greenhouse gas assessments and on CO2 costs and savings, with around 20 industry members meeting every five weeks, and I am establishing an e-waste recycling working group. I also co-organise the SIGN Expert Forum.
- id: cbam-advice-on-the-design-and
  role: adelphi-mgr
  title: 'CBAM: advice on the design and implementation of the MRV mechanism'
  client: Umweltbundesamt (UBA)
  themes:
    - ghg
    - policy
  text: Researched the production stages and value chains of key CBAM-relevant products (iron and steel, fertilisers) and analysed system boundary definitions and the implementation challenges producers face.
- id: empowering-partner-countries-to-engage-in
  role: adelphi-mgr
  title: Empowering Partner Countries to Engage in the NDC Partnership
  client: GIZ, Small Island Developing States (Seychelles, Mauritius)
  themes:
    - policy
  text: Led the NDC roadmap analysis. Evaluated national mitigation policies in energy, transport, waste and industry against climate targets, reviewed national strategy documents for policy gaps, and recommended ways to raise ambition in the industrial and energy sectors for revised NDCs.
- id: spa
  role: adelphi-mgr
  title: Support Project for the Implementation of the Paris Agreement (SPA)
  client: GIZ, three assignments
  themes:
    - finance
    - ghg
    - policy
  text: 'Three assignments for GIZ:'
  points:
    - 'Uganda, climate finance access: led the analysis of barriers faced by SMEs and MSMEs, with a focus on youth- and women-led enterprises in agriculture, energy and transport. Assessed the policy landscape, wrote the report with recommendations for the Government of Uganda, and managed engagement with the Climate Finance Unit.'
    - 'Nigeria, climate finance MRV: researched global best practice and developed an MRV roadmap feeding into Nigeria''s Net Zero Investment Plan.'
    - 'GHG inventory compilation for industry: analysed the IPCC 2006 Guidelines and best practice for metals, and condensed them into an accessible GHG accounting guide and a methodology and governance framework for monitoring, reporting and verifying industrial process emissions.'
- id: sarawak-net-zero-strategy-and-carbon
  role: adelphi-mgr
  title: Sarawak Net Zero Strategy and Carbon Plan
  client: PwC Advisory Services for the Ministry of Energy and Environmental Sustainability, Malaysia
  themes:
    - ghg
    - policy
  text: Technical consultancy on GHG accounting for the Sarawak region applying the IPCC Guidelines and the GPC. Reviewed calculations, built bespoke Excel tools, gave expert input on uncertainty quantification, and contributed to integrating sectoral mitigation options into long-term planning.
- id: scaling-adaptation-finance-through-banks-and
  role: adelphi-mgr
  title: Scaling Adaptation Finance Through Banks and the Private Sector
  client: Global Center on Adaptation, Cooperative Rural Development Bank Tanzania
  themes:
    - finance
    - ghg
  text: Facilitated stakeholder meetings for data collection and validation, adapted the data collection framework, ran end-to-end emission calculations in Excel using the UNFCCC framework, and authored the final report with recommendations.
