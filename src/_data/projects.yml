- id: gain-jordan
  role: adelphi-cons
  title: 'GAIN: Strengthening Green Economy in Jordan'
  client: GIZ, policy advisory and green business development
  themes:
    - textiles
    - circular
  text: Project management, and a contribution to the work package on circularity in the Jordanian ready-made garment industry. Held online and in-person consultations with garment companies, textile recyclers, international investors and the chamber of industry, made site visits in Jordanian industrial zones to assess circular practices, and led the writing of the textile waste sorting and collection guideline. Facilitated a dialogue between local stakeholders and investors on a national recycling plant.
- id: cost-allocation-and-incentives-for-sustainable
  role: adelphi-cons
